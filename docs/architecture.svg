<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">ShopLedger application architecture</title>
  <desc id="desc">Architecture diagram of the ShopLedger browser UI, Express server, routes, library modules, configuration, and JSON database. An emphasized path traces order placement from the UI through the orders router, business logic, database persistence, and response.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker>
    <marker id="orderArrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ea580c"/></marker>
    <style>
      text{font-family:Inter,Segoe UI,Arial,sans-serif;fill:#172033}.title{font-size:30px;font-weight:700}.subtitle{font-size:14px;fill:#64748b}.section{font-size:16px;font-weight:700;letter-spacing:.5px;fill:#475569}.nodeTitle{font-size:15px;font-weight:700}.nodeText{font-size:12px;fill:#475569}.small{font-size:11px;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}.ui{fill:#eff6ff;stroke:#60a5fa}.server{fill:#f8fafc;stroke:#64748b}.router{fill:#f5f3ff;stroke:#a78bfa}.lib{fill:#ecfdf5;stroke:#6ee7b7}.data{fill:#fff7ed;stroke:#fb923c}.edge{fill:none;stroke:#64748b;stroke-width:1.7;marker-end:url(#arrow)}.order{fill:none;stroke:#ea580c;stroke-width:3;marker-end:url(#orderArrow)}.label{font-size:11px;font-weight:600;fill:#475569}.orderLabel{font-size:12px;font-weight:700;fill:#c2410c}.step{fill:#ea580c;stroke:#fff;stroke-width:2}.stepText{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:middle}
    </style>
  </defs>
  <rect width="1600" height="1120" fill="#f8fafc"/>
  <text x="52" y="56" class="title">ShopLedger · application architecture</text>
  <text x="52" y="82" class="subtitle">Express application · browser POS · JSON file storage</text>
  <rect x="1180" y="34" width="370" height="48" rx="12" fill="#fff7ed" stroke="#fdba74"/>
  <path d="M1200 58h42" class="order"/><text x="1255" y="63" class="orderLabel">Order placement path</text>

  <!-- Browser UI -->
  <text x="52" y="142" class="section">BROWSER UI</text>
  <rect x="52" y="158" width="330" height="194" rx="14" class="box ui"/>
  <text x="76" y="190" class="nodeTitle">public/</text>
  <text x="76" y="218" class="nodeText">index.html · app.js · css/style.css</text>
  <text x="76" y="250" class="nodeText">POS catalog and cart</text>
  <text x="76" y="274" class="nodeText">Order register and invoice links</text>
  <text x="76" y="298" class="nodeText">Khata customers and settlements</text>
  <text x="76" y="322" class="nodeText">Inventory and GST reconciliation</text>

  <!-- Server -->
  <text x="435" y="142" class="section">HTTP APPLICATION</text>
  <rect x="435" y="158" width="280" height="194" rx="14" class="box server"/>
  <text x="459" y="190" class="nodeTitle">server.js · Express</text>
  <text x="459" y="218" class="nodeText">JSON request parsing</text>
  <text x="459" y="242" class="nodeText">Serves public/ static files</text>
  <text x="459" y="266" class="nodeText">Mounts routers at /api</text>
  <text x="459" y="290" class="nodeText">GET /orders/:id/invoice</text>
  <text x="459" y="322" class="small">Starts on config.port</text>

  <!-- Routers -->
  <text x="790" y="142" class="section">ROUTERS · routes/</text>
  <rect x="790" y="158" width="280" height="82" rx="12" class="box router"/>
  <text x="814" y="188" class="nodeTitle">orders.js</text><text x="814" y="214" class="nodeText">List · get · place · cancel</text>
  <rect x="790" y="252" width="280" height="68" rx="12" class="box router"/>
  <text x="814" y="280" class="nodeTitle">products.js</text><text x="814" y="303" class="nodeText">Products · active coupons</text>
  <rect x="790" y="332" width="280" height="68" rx="12" class="box router"/>
  <text x="814" y="360" class="nodeTitle">customers.js</text><text x="814" y="383" class="nodeText">Customers · record settlement</text>
  <rect x="790" y="412" width="280" height="82" rx="12" class="box router"/>
  <text x="814" y="442" class="nodeTitle">reports.js</text><text x="814" y="466" class="nodeText">Dashboard · GST · preview · export</text>

  <!-- Libraries -->
  <text x="1150" y="142" class="section">BUSINESS LOGIC · lib/</text>
  <rect x="1150" y="158" width="400" height="82" rx="12" class="box lib"/>
  <text x="1174" y="188" class="nodeTitle">orders.js</text><text x="1174" y="214" class="nodeText">Create · fetch · list · cancel an order</text>
  <rect x="1150" y="252" width="190" height="76" rx="12" class="box lib"/>
  <text x="1174" y="282" class="nodeTitle">inventory.js</text><text x="1174" y="306" class="nodeText">Find · check · reserve · release</text>
  <rect x="1360" y="252" width="190" height="76" rx="12" class="box lib"/>
  <text x="1384" y="282" class="nodeTitle">pricing.js</text><text x="1384" y="306" class="nodeText">Subtotal · discount · GST totals</text>
  <rect x="1150" y="340" width="190" height="76" rx="12" class="box lib"/>
  <text x="1174" y="370" class="nodeTitle">coupons.js</text><text x="1174" y="394" class="nodeText">Normalize · validate · discount</text>
  <rect x="1360" y="340" width="190" height="76" rx="12" class="box lib"/>
  <text x="1384" y="370" class="nodeTitle">tax.js</text><text x="1384" y="394" class="nodeText">HSN rates · CGST/SGST split</text>
  <rect x="1150" y="428" width="190" height="76" rx="12" class="box lib"/>
  <text x="1174" y="458" class="nodeTitle">ledger.js</text><text x="1174" y="482" class="nodeText">Khata · balances · settlement</text>
  <rect x="1360" y="428" width="190" height="76" rx="12" class="box lib"/>
  <text x="1384" y="458" class="nodeTitle">store.js</text><text x="1384" y="482" class="nodeText">Read · write · audit log</text>
  <rect x="1150" y="516" width="190" height="76" rx="12" class="box lib"/>
  <text x="1174" y="546" class="nodeTitle">reports.js</text><text x="1174" y="570" class="nodeText">Dashboard · GST reconciliation</text>
  <rect x="1360" y="516" width="190" height="76" rx="12" class="box lib"/>
  <text x="1384" y="546" class="nodeTitle">invoice.js</text><text x="1384" y="570" class="nodeText">Invoice figures · HTML rendering</text>
  <rect x="1150" y="604" width="190" height="68" rx="12" class="box lib"/>
  <text x="1174" y="634" class="nodeTitle">dates.js</text><text x="1174" y="657" class="nodeText">Today · normalize · fiscal year</text>

  <!-- config and data -->
  <text x="52" y="430" class="section">SETTINGS &amp; PERSISTENCE</text>
  <rect x="52" y="450" width="310" height="112" rx="14" class="box data"/>
  <text x="76" y="482" class="nodeTitle">config.js</text>
  <text x="76" y="510" class="nodeText">Port · shop details · GST slabs</text>
  <text x="76" y="534" class="nodeText">Inventory defaults · coupon definitions</text>
  <rect x="400" y="450" width="310" height="112" rx="14" class="box data"/>
  <text x="424" y="482" class="nodeTitle">data/db.json</text>
  <text x="424" y="510" class="nodeText">Products · orders · customers</text>
  <text x="424" y="534" class="nodeText">Settlements · audit log · ID counters</text>

  <!-- ordinary wiring, behind highlighted order path -->
  <path d="M382 226H435" class="edge"/><text x="390" y="214" class="label">HTTP</text>
  <path d="M715 205H790" class="edge"/><path d="M715 270H790" class="edge"/><path d="M715 350H790" class="edge"/><path d="M715 440H790" class="edge"/>
  <path d="M1070 199H1150" class="edge"/><path d="M1070 286H1150" class="edge"/><path d="M1070 365H1150" class="edge"/><path d="M1070 450H1150" class="edge"/>
  <path d="M362 506H400" class="edge"/><text x="366" y="494" class="label">config</text>
  <path d="M710 506H1360" class="edge"/><text x="962" y="494" class="label">read/write JSON</text>
  <!-- order workflow spine and dependencies -->
  <path d="M235 352V760H925V199H790" class="order"/>
  <circle cx="235" cy="390" r="13" class="step"/><text x="235" y="390" class="stepText">1</text>
  <text x="253" y="768" class="orderLabel">POST /api/orders · cart items, coupon, customer, payment mode</text>
  <path d="M1070 199H1100V705H1275V240" class="order"/>
  <circle cx="1100" cy="705" r="13" class="step"/><text x="1100" y="705" class="stepText">2</text>
  <text x="1118" y="710" class="orderLabel">Resolve product lines · create order</text>
  <path d="M1275 240V252" class="order"/>
  <circle cx="1275" cy="246" r="13" class="step"/><text x="1275" y="246" class="stepText">3</text>
  <path d="M1320 240V296H1360" class="order"/>
  <circle cx="1340" cy="296" r="13" class="step"/><text x="1340" y="296" class="stepText">4</text>
  <path d="M1455 328V340" class="order"/>
  <path d="M1360 378H1340" class="order"/>
  <path d="M1245 416V428" class="order"/>
  <path d="M1340 466H1360" class="order"/>
  <circle cx="1350" cy="466" r="13" class="step"/><text x="1350" y="466" class="stepText">5</text>

  <!-- Workflow explanation -->
  <rect x="52" y="812" width="1498" height="258" rx="18" fill="#fff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="80" y="852" class="section">ORDER PLACEMENT · POST /api/orders</text>
  <g transform="translate(80,882)">
    <circle cx="14" cy="14" r="14" class="step"/><text x="14" y="14" class="stepText">1</text>
    <text x="40" y="10" class="nodeTitle">UI sends cart</text><text x="40" y="34" class="nodeText">Selected product IDs and quantities, coupon, customer, payment mode.</text>
    <circle cx="14" cy="78" r="14" class="step"/><text x="14" y="78" class="stepText">2</text>
    <text x="40" y="74" class="nodeTitle">orders route validates</text><text x="40" y="98" class="nodeText">Loads product records; checks stock and coupon; computes order totals.</text>
    <circle cx="14" cy="142" r="14" class="step"/><text x="14" y="142" class="stepText">3</text>
    <text x="40" y="138" class="nodeTitle">Business logic updates</text><text x="40" y="162" class="nodeText">Khata debit when selected; inventory deduction; new order and audit entry.</text>
    <circle cx="14" cy="206" r="14" class="step"/><text x="14" y="206" class="stepText">4</text>
    <text x="40" y="202" class="nodeTitle">store.js persists</text><text x="40" y="226" class="nodeText">Writes updated database JSON; route returns HTTP 201 with order.</text>
  </g>
  <text x="850" y="906" class="nodeTitle">Order total calculation</text>
  <text x="850" y="934" class="nodeText">pricing.js → coupons.js (discount) → tax.js (HSN GST and split)</text>
  <text x="850" y="980" class="nodeTitle">Other order related paths</text>
  <text x="850" y="1008" class="nodeText">Customer credit: ledger.js · Order listing/cancel: orders.js</text>
  <text x="850" y="1032" class="nodeText">Printable invoice: server.js → invoice.js · reports.js reconciles invoice and order totals</text>
</svg>
